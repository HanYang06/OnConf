[project]
name = "auto-conf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HanYang06", email = "jihanyang123@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
auto-conf = "auto_conf:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
