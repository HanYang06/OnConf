name: 缺陷报告
description: 报告一个可复现的缺陷（不是用法问题，也不是安全漏洞）
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告缺陷。请尽量把信息填完整：**没有最小复现的缺陷报告，通常无法被处理。**

        提问之前请先确认：

        - 你用的是**最新版本**，且 Python 版本 **>= 3.14**；
        - 你已在 [Issues](https://github.com/HanYang06/auto-conf/issues)
          与 [Discussions](https://github.com/HanYang06/auto-conf/discussions) 里搜过同样的报错；
        - 这**不是安全漏洞**。安全漏洞请走
          [SECURITY.md](https://github.com/HanYang06/auto-conf/blob/main/SECURITY.md) 的私密渠道，
          不要在这里贴细节；
        - 这不是「怎么用」的问题。用法问题请走 Discussions，
          渠道分工见 [SUPPORT.md](https://github.com/HanYang06/auto-conf/blob/main/SUPPORT.md)。

  - type: input
    id: version
    attributes:
      label: auto-conf 版本
      description: 源码检出请看 pyproject.toml 的 version 字段或 uv.lock；已安装请给出 uv pip show auto-conf 的输出。
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python 版本
      description: 请贴 `python -V` 的完整输出（含实现与位数）。
      placeholder: 例如 Python 3.14.8
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 请选择你实际运行的环境；跨平台差异在本项目中很常见。
      options:
        - Windows
        - macOS
        - Linux
        - 其他（请在下方说明）
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装方式
      description: 不同安装方式对应不同的依赖集合，排查路径不一样。
      options:
        - uv sync --all-groups（源码检出）
        - uv add auto-conf
        - pip install auto-conf
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 能直接跑的最小代码片段，或最小配置目录结构（含文件内容）。请去掉无关的业务代码。
      placeholder: |
        # 1. 目录结构
        # conf/app.yaml
        #   app:
        #     port: 8080

        # 2. 运行这段代码
        from auto_conf import conf
        conf("app.port", 9090)
        print(conf("app.port"))
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么；如果与文档不符，请附上文档链接或引文。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么。请贴文本，不要只贴截图。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 审计日志与报错全文
      description: 完整的 traceback、审计事件流（JSONL）或人读报告。请勿删减关键帧，也请先抹掉真实密钥与敏感值。
      render: text
    validations:
      required: true

  - type: dropdown
    id: concurrency
    attributes:
      label: 是否涉及多进程 / 多实例并发
      description: 本项目的并发读写语义是核心语义之一，这一项会直接决定排查方向。
      options:
        - 是 —— 多个进程或实例同时读写同一批配置文件
        - 否 —— 只有单个进程
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他有助于定位的信息，例如是可稳定复现还是偶发、出现频率、是否发生在网络盘或同步目录上。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions，没有找到相同问题。
          required: true
        - label: 我使用的是最新版本，且 Python 版本 >= 3.14。
          required: true
        - label: 我已按模板提供了最小复现，并抹掉了所有真实密钥与敏感值。
          required: true
