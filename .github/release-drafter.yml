# Release Drafter 配置
#
# 依据 Conventional Commits 生成发布说明：
# 提交信息与 PR 标题的类型前缀（feat / fix / perf / …）由 autolabeler 映射成标签，
# 标签再决定这条变更落进哪个分类。
#
# 约定：
#   - **PR 标题**必须是合法的 Conventional Commits（发布说明取的是 PR 标题与标签，
#     不是 main 上的提交信息）：subject 允许中文，例如「fix(core): 指令键豁免对账」；
#   - 破坏性变更在类型后加 `!`，例如「feat(core)!: 移除旧的对账开关」。

# ⚠️ 版本号的**权威来源是 `pyproject.toml`**（发版走 `uv version`，见 CONTRIBUTING §4.4）。
# 下面的 $NEXT_PATCH_VERSION 只是发布说明草稿的**建议值**：它按标签猜，而
# .github/workflows/release.yml 只认 pyproject 里的版本 —— 两者不一致时 tag 会被 CI
# 拒掉。所以最终以 `uv version --short` 为准，这里不要当成版本决策。
name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

no-changes-template: '- 本次发布没有可记录的变更。'
category-template: '### $TITLE'

# 这些标签的 PR 不进入发布说明
exclude-labels:
  - 'skip-changelog'
  - 'no-changelog'
  - 'duplicate'
  - 'invalid'
  - 'question'
  - 'wontfix'

# 分类顺序即发布说明中的顺序：破坏性变更永远排在最前
categories:
  - title: '💥 破坏性变更'
    labels:
      - 'breaking-change'
      - 'BREAKING CHANGE'
  - title: '✨ 新功能'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 缺陷修复'
    labels:
      - 'fix'
      - 'bug'
  - title: '⚡ 性能优化'
    labels:
      - 'perf'
      - 'performance'
  - title: '📝 文档'
    labels:
      - 'docs'
      - 'documentation'
  - title: '♻️ 重构'
    labels:
      - 'refactor'
  - title: '✅ 测试'
    labels:
      - 'test'
  - title: '📦 构建与依赖'
    labels:
      - 'build'
      - 'dependencies'
  - title: '👷 持续集成'
    labels:
      - 'ci'
  - title: '🔧 杂项'
    labels:
      - 'chore'
      - 'maintenance'
  - title: '⏪ 回滚'
    labels:
      - 'revert'

# 版本号推断：破坏性变更进 major，新功能进 minor，其余进 patch。
# name-template / tag-template 里的 $NEXT_PATCH_VERSION 会按这里的结论取到完整版本号。
version-resolver:
  major:
    labels:
      - 'breaking-change'
      - 'BREAKING CHANGE'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
      - 'dependencies'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'perf'
      - 'performance'
      - 'docs'
      - 'documentation'
      - 'refactor'
      - 'test'
      - 'build'
      - 'ci'
      - 'chore'
      - 'maintenance'
      - 'revert'
  default: patch

# 按 PR 标题（Conventional Commits）与分支名自动打标签
autolabeler:
  # 破坏性变更：`feat!: …` / `feat(core)!: …`
  - label: 'breaking-change'
    title:
      - '/^[a-zA-Z]+(\([^)]+\))?!:/'
  - label: 'feat'
    title:
      - '/^feat(\([^)]+\))?!?:/'
    branch:
      - '/^feat\//'
  - label: 'fix'
    title:
      - '/^fix(\([^)]+\))?!?:/'
    branch:
      - '/^fix\//'
  - label: 'perf'
    title:
      - '/^perf(\([^)]+\))?!?:/'
    branch:
      - '/^perf\//'
  - label: 'docs'
    title:
      - '/^docs(\([^)]+\))?!?:/'
    branch:
      - '/^docs\//'
  - label: 'refactor'
    title:
      - '/^refactor(\([^)]+\))?!?:/'
    branch:
      - '/^refactor\//'
  - label: 'test'
    title:
      - '/^test(\([^)]+\))?!?:/'
    branch:
      - '/^test\//'
  - label: 'build'
    title:
      - '/^build(\([^)]+\))?!?:/'
    branch:
      - '/^build\//'
  - label: 'ci'
    title:
      - '/^ci(\([^)]+\))?!?:/'
    branch:
      - '/^ci\//'
  - label: 'chore'
    title:
      - '/^chore(\([^)]+\))?!?:/'
    branch:
      - '/^chore\//'
  - label: 'revert'
    title:
      - '/^revert(\([^)]+\))?!?:/'

template: |
  ## 本次发布

  $CHANGES

  ## 安装

  ```bash
  uv add onconf
  ```

  需要 Python >= 3.14。完整说明见[文档站](https://hanyang06.github.io/OnConf/)。

  ## 贡献者

  $CONTRIBUTORS

  ## 说明

  - 本项目遵循「文件绝对优先」：升级不会用代码里的默认值冲掉你手改过的值。
  - 标记为「破坏性变更」的条目，请先读迁移说明再升级。
  - 构建与发布由 `.github/workflows/release.yml` 的 `build` 与 `publish` 两个 job 完成，
    发布使用 PyPI trusted publishing（手动触发 + tag 触发）。
  - 安全漏洞请走 [SECURITY.md](https://github.com/HanYang06/OnConf/blob/main/SECURITY.md)
    的私密渠道报告。

  **完整变更记录**：https://github.com/HanYang06/OnConf/compare/$PREVIOUS_TAG...v$NEXT_PATCH_VERSION
