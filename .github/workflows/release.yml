# ============================================================================
# Release —— 构建 + 来源证明 + 发布到 PyPI
#
# ⚠️ 项目名（PyPI 发布名）是 `onconf`，但本工作流里**刻意不出现**它：
#    pypa/gh-action-pypi-publish 走 trusted publishing（OIDC），
#    项目身份由 PyPI 侧的 Trusted Publisher 配置决定，而不是写在这里。
#
#    发布前需要在 PyPI 配置 Trusted Publisher，**四项**必须与此处完全一致：
#      Owner:            HanYang06
#      Repository:       OnConf      ← 仓库改名会动这一项，改完必须同步 PyPI
#      Workflow name:    release.yml
#      Environment name: pypi
#    先在 PyPI 创建 `onconf` 项目（或提交 pending publisher），再打 v* tag 触发本工作流。
#
#    权限说明：id-token: write 是 OIDC 换取短期凭据的前提；
#    attestations: write 用于写来源证明。二者都不需要长期 secret。
# ============================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只构建与生成来源证明，跳过真正的 PyPI 发布"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 版本闸门：**版本号只有一个来源 —— `pyproject.toml` 的 `[project] version`**，
  # 改动一律走 `uv version`（它会把 pyproject.toml 与 uv.lock 一起改好）。
  #
  # 这里做两件事：
  #   1. 打 tag 触发时，要求 tag 就是 `v<pyproject 里的版本>`。否则「tag 写 v0.2.0、
  #      包里还是 0.1.0」这种发布会被放出门，而 PyPI 上的版本号不可撤回；
  #   2. 把版本号交给下游 job —— 构建与发布都用它，而不是各自去猜。
  # --------------------------------------------------------------------------
  version:
    name: Resolve version from pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      # --frozen：只读版本号，不重写 uv.lock、不动虚拟环境。
      # 这一步也顺带证明「pyproject 与 uv.lock 是一致的」：版本对不上时它会直接失败。
      - name: Read the project version
        id: version
        run: echo "version=$(uv version --short --frozen)" >> "$GITHUB_OUTPUT"

      # 只有 tag 触发才有「tag 与版本」可比；workflow_dispatch（dry-run）跳过。
      # 注意走 env 而不是把 ${{ }} 直接塞进 run：这是 zizmor 的模板注入审计点。
      - name: Tag must match the project version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag 是 $TAG，但 pyproject.toml 里的版本是 $VERSION（期望 tag v$VERSION）"
            echo "::error::版本号请用 \`uv version --bump …\` 改，并让 tag 与它一致。"
            exit 1
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "本次发布的版本（来自 pyproject.toml）：$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # 构建 sdist/wheel，并为其生成可验证的构建来源证明
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # attest-build-provenance 需要 OIDC 令牌完成签名
      attestations: write # 写入 attestation 记录
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 此处刻意**不开缓存**（enable-cache: false）：
      # 本工作流的产物会发布到 PyPI，若复用可写的 Actions cache，
      # 理论上存在 cache poisoning 风险（污染缓存中的依赖 → 污染最终发布件），
      # zizmor 的 cache-poisoning 审计（high）正是针对这一点。
      # 发布工作流一年只跑几次，放弃缓存换确定性是划算的。
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # 构建后端是 uv_build，sdist + wheel 一起产出到 dist/。
      - name: Build
        run: uv build

      # 「发布依赖配置文件里的版本」的最后一环：产物文件名必须带着它。
      # 名字对不上就说明构建时读到的不是同一个版本号 —— 直接失败，别发出去。
      - name: Artifacts must carry the project version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist/
          # 逐个文件数，不用 `ls dist/ | grep`：文件名里有空格/换行时它会数错，
          # 那种写法本身也过不了静态检查（SC2010）—— 而且别在注释里以工具名
          # 打头写「工具名 的」，会被读成指示范式（SC1072/SC1073）。
          matching=0
          for artifact in dist/*"$VERSION"*; do
            [ -f "$artifact" ] || continue
            matching=$((matching + 1))
          done
          if [ "$matching" -lt 2 ]; then
            echo "::error::dist/ 里没有同时带着版本 $VERSION 的 sdist 与 wheel"
            exit 1
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 构建产物缺失属于严重异常，必须直接失败而不是放过。
          if-no-files-found: error
          retention-days: 30

      # 对 dist/* 生成 SLSA 构建来源证明：使用者可用
      # `gh attestation verify <file> --repo HanYang06/onconf` 校验产物
      # 确实由本仓库的这次运行构建，而非事后被替换。
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # --------------------------------------------------------------------------
  # 发布到 PyPI（dry-run 时整体跳过）
  # --------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [version, build]
    # dry-run 语义：workflow_dispatch 勾选 dry-run（默认 true）时只构建不发版；
    # 打 tag 推送时不带该输入（inputs 上下文为空），因此会真正发布。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: pypi —— 与 PyPI Trusted Publisher 里登记的 Environment name 对应，
    # 同时让这次发布受环境保护规则（审批/限制分支）约束。
    environment: pypi
    permissions:
      id-token: write # 向 PyPI 交换 OIDC 短期发布凭据，无需 API token
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # 发布前把版本号写进运行摘要：出问题时一眼能看出「这次发的是哪个版本」。
      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "发布版本（来自 pyproject.toml）：$VERSION" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/ >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # packages-dir 用 kebab-case（下划线形式在该版本已标记废弃）。
          packages-dir: dist/
