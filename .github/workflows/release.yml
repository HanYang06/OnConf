# ============================================================================
# Release —— 构建 + 来源证明 + 发布到 PyPI + 建 GitHub Release
#
# ## 什么时候会跑，什么时候**真的发**
#
#     push 一个 `v*` tag   →  build + **publish** + **建 Release**（唯一的发布入口）
#     workflow_dispatch    →  只 build + 来源证明，**永不发布**
#
# 发布前的四道闸门：前三道在 `version` job，第四道在 `build` job。任一不过就出不去：
#   1. tag 必须正是 `v<pyproject.toml 里的版本>`；
#   2. tag 指向的提交必须在 `main` 上 —— 合并进主分支才算数；
#   3. `docs/CHANGELOG/<版本>.md` 必须存在 —— Release 正文与站点版本页都由它生成；
#   4. 构建之后核对 `dist/` 里同时有带着该版本号的 sdist 与 wheel。
#
# 「先合并到 main、再在 main 的提交上打 tag」因此在 CI 里是**被强制的**，不只是约定；
# 反过来，「在任意分支的提交上打个 tag」或「手动点一下」都发不出去。
#
# PyPI 发出去之后，末尾的 `release` job 用同一份变更页建 GitHub Release：
# 正文 = `docs/CHANGELOG/<版本>.md`（相对链接已绝对化）+ GitHub 原生自动附录
# （PR / 作者 / 新贡献者 / 完整对比，分类规则见 `.github/release.yml`）。
#
# ⚠️ 项目名（PyPI 发布名）是 `onconf`，但本工作流里**刻意不出现**它：
#    pypa/gh-action-pypi-publish 走 trusted publishing（OIDC），
#    项目身份由 PyPI 侧的 Trusted Publisher 配置决定，而不是写在这里。
#
#    发布前需要在 PyPI 配置 Trusted Publisher，**四项**必须与下面一致（大小写按 claim 填：
#    PyPI 只对 `repository_owner` 做**大小写敏感**的 `str.__eq__`，其余几项它自己折叠大小写）：
#      Owner:            HanYang06
#      Repository:       OnConf      ← 仓库改名会动这一项，改完必须同步 PyPI
#      Workflow name:    release.yml    ← 只填文件名，不要带 .github/workflows/ 路径
#      Environment name: pypi
#
#    首次发布（`onconf` 在 PyPI 上还不存在）必须用 **pending publisher**：
#      https://pypi.org/manage/account/publishing/ ，PyPI Project Name 填 `onconf`，
#      再加上面四项；项目由第一次成功上传创建。没注册、或任一项对不上，mint-token
#      就会以 `invalid-publisher: valid token, but no corresponding publisher` 拒绝
#      （实测踩过一次，见 CONTRIBUTING §4.4）。修好之后在原来那次失败的运行上点
#      **Re-run failed jobs** 即可，无需重新打 tag（claims 不变，artifact 也还在）。
#
#    仓库侧还可以给 `pypi` environment 加「只允许 main 部署」的保护规则当第二道锁。
#
#    权限说明：id-token: write 是 OIDC 换取短期凭据的前提；
#    attestations: write 用于写来源证明。二者都不需要长期 secret。
# ============================================================================
name: Release

on:
  # 唯一的发布入口：在 main 上打好 v<版本> tag 后推它（完整 runbook 见 CONTRIBUTING §4.4）。
  push:
    tags: ["v*"]
  # 只构建、不发布的手动入口：用来在真正打 tag 之前验证版本解析 / 构建 / 产物命名 /
  # 来源证明这几步。它**没有**「发布」这个模式，所以手动触发不可能误发版。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 版本闸门：**版本号只有一个来源 —— `pyproject.toml` 的 `[project] version`**，
  # 改动一律走 `uv version`（它会把 pyproject.toml 与 uv.lock 一起改好）。
  #
  # 这里做四件事：
  #   1. 打 tag 触发时，要求 tag 就是 `v<pyproject 里的版本>`。否则「tag 写 v0.2.0、
  #      包里还是 0.1.0」这种发布会被放出门，而 PyPI 上的版本号不可撤回；
  #   2. 打 tag 触发时，要求 tag 指向的提交**已经在 main 上**（合并进主分支才算数）；
  #   3. 打 tag 触发时，要求该版本的变更页存在 —— 没有变更记录的版本不发；
  #   4. 把版本号交给下游 job —— 构建与发布都用它，而不是各自去猜。
  # --------------------------------------------------------------------------
  version:
    name: Resolve version from pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 下面那道「tag 必须在 main 上」的闸门要真的走历史：浅克隆会让 merge-base
          # 答不上来。fetch-depth: 0 取全部分支与 tag 的历史（origin/main 因此存在）。
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      # --frozen：只读版本号，不重写 uv.lock、不动虚拟环境。
      # 这一步也顺带证明「pyproject 与 uv.lock 是一致的」：版本对不上时它会直接失败。
      - name: Read the project version
        id: version
        run: echo "version=$(uv version --short --frozen)" >> "$GITHUB_OUTPUT"

      # 只有 tag 触发才有「tag 与版本」可比；workflow_dispatch（只构建）跳过。
      # 注意走 env 而不是把 ${{ }} 直接塞进 run：这是 zizmor 的模板注入审计点。
      - name: Tag must match the project version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag 是 $TAG，但 pyproject.toml 里的版本是 $VERSION（期望 tag v$VERSION）"
            echo "::error::版本号请用 \`uv version --bump …\` 改，并让 tag 与它一致。"
            exit 1
          fi

      # 第二道闸门：tag 指向的提交必须已经在 main 上。
      # 「先合并到主分支、再在 main 的提交上打 tag」这句话以前只是约定 —— 没有这一步，
      # 在**任意分支**的提交上打一个 `v1.2.3` 也能把包发出去，而 PyPI 的版本号不可撤回。
      # 失败是「关闭」的：origin/main 不存在（浅克隆之类）时这里同样非 0 退出、照样挡住发布。
      - name: Tag must point at a commit on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $TAG 指向的提交不在 main 上：先把改动合并进 main，再在 main 的提交上打标签。"
            exit 1
          fi

      # 第三道闸门：发出去的版本必须有一页变更记录 —— Release 正文与站点版本页都由它生成。
      # 没有它，「发了一个版本但没人知道改了什么」这种事只能靠事后补，补不回来。
      # 只在 tag 触发时要求；workflow_dispatch（只构建）跳过。
      - name: Changelog page must exist
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          page="docs/CHANGELOG/$VERSION.md"
          if [ ! -f "$page" ]; then
            echo "::error::$page 不存在：先把未发布页收成该版本页再打 tag。"
            echo "::error::命令：uv run python scripts/release_notes.py finalize $VERSION"
            exit 1
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "本次运行的版本（来自 pyproject.toml）：$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # 构建 sdist/wheel，并为其生成可验证的构建来源证明
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # attest-build-provenance 需要 OIDC 令牌完成签名
      attestations: write # 写入 attestation 记录
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 此处刻意**不开缓存**（enable-cache: false）：
      # 本工作流的产物会发布到 PyPI，若复用可写的 Actions cache，
      # 理论上存在 cache poisoning 风险（污染缓存中的依赖 → 污染最终发布件），
      # zizmor 的 cache-poisoning 审计（high）正是针对这一点。
      # 发布工作流一年只跑几次，放弃缓存换确定性是划算的。
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # 构建后端是 uv_build，sdist + wheel 一起产出到 dist/。
      - name: Build
        run: uv build

      # 「发布依赖配置文件里的版本」的最后一环：产物文件名必须带着它。
      # 名字对不上就说明构建时读到的不是同一个版本号 —— 直接失败，别发出去。
      - name: Artifacts must carry the project version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist/
          # 逐个文件数，不用 `ls dist/ | grep`：文件名里有空格/换行时它会数错，
          # 那种写法本身也过不了静态检查（SC2010）—— 而且别在注释里以工具名
          # 打头写「工具名 的」，会被读成指示范式（SC1072/SC1073）。
          matching=0
          for artifact in dist/*"$VERSION"*; do
            [ -f "$artifact" ] || continue
            matching=$((matching + 1))
          done
          if [ "$matching" -lt 2 ]; then
            echo "::error::dist/ 里没有同时带着版本 $VERSION 的 sdist 与 wheel"
            exit 1
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 构建产物缺失属于严重异常，必须直接失败而不是放过。
          if-no-files-found: error
          retention-days: 30

      # 对 dist/* 生成 SLSA 构建来源证明：使用者可用
      # `gh attestation verify <file> --repo HanYang06/OnConf` 校验产物
      # 确实由本仓库的这次运行构建，而非事后被替换。
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # --------------------------------------------------------------------------
  # 发布到 PyPI —— **只有 tag 推送会走到这里**（手动触发只构建，见文件头）
  # --------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [version, build]
    # 唯一的发布入口是推 `v*` tag（届时 version job 的四道闸门都过了才会轮到这一步）。
    # 手动触发一概跳过 —— 「勾一个框就能发版」那条路等于把四道闸门全绕过去，
    # 而 PyPI 上的版本号不可撤回。
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: pypi —— 与 PyPI Trusted Publisher 里登记的 Environment name 对应，
    # 同时让这次发布受环境保护规则（审批/限制分支）约束；建议再给它加一条
    # 「只允许 main 部署」的分支规则当第二道锁。
    environment: pypi
    permissions:
      id-token: write # 向 PyPI 交换 OIDC 短期发布凭据，无需 API token
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # 发布前把版本号写进运行摘要：出问题时一眼能看出「这次发的是哪个版本」。
      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "发布版本（来自 pyproject.toml）：$VERSION" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/ >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # packages-dir 用 kebab-case（下划线形式在该版本已标记废弃）。
          packages-dir: dist/

  # --------------------------------------------------------------------------
  # 建 GitHub Release —— 只有 tag 推送会走到这里，且必须等 PyPI 发布成功
  #
  # 正文两段拼起来：
  #   1. **人写的那一段** = `docs/CHANGELOG/<版本>.md`，由 scripts/release_notes.py
  #      把页内相对链接换成仓库绝对链接（Release 正文不在仓库上下文里，相对链接解析不到）；
  #   2. **机器写的那一段** = GitHub 原生自动附录（合并进来的 PR、作者、新贡献者、
  #      完整对比），分类规则在 `.github/release.yml`，标签由 labeler 工作流打。
  #
  # 这一步失败不会把已经上传到 PyPI 的版本收回来 —— Release 可以事后重跑；
  # 「有没有变更页」这一条已经由 version job 的闸门挡在前面了。
  # --------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [version, publish]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 建 Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      # 人写的那一段：该版本的变更页，相对链接已绝对化。
      - name: Build the release body from the changelog page
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          uv run python scripts/release_notes.py body "$VERSION" --output release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      # 机器写的那一段：谁修的、哪条 PR，不靠人抄。
      - name: Append the generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated-notes.md
          printf '\n---\n\n' >> release-body.md
          cat generated-notes.md >> release-body.md

      # --verify-tag：tag 不存在就直接失败，不建一个没有对应提交的 Release。
      # 预发布版本（`2.1.0a1` 这种）标成 prerelease，不去抢 "Latest"。
      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          extra=()
          if [[ "$VERSION" =~ [a-zA-Z] ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            --verify-tag \
            "${extra[@]}"
