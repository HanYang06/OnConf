# ============================================================================
# Release —— 构建 + 来源证明 + 发布到 PyPI
#
# ⚠️ PyPI 项目名尚未定案，因此本工作流里**不出现任何 PyPI 项目名**：
#    pypa/gh-action-pypi-publish 走 trusted publishing（OIDC），
#    项目身份由 PyPI 侧的 Trusted Publisher 配置决定，而不是写在这里。
#
#    发布前需要在 PyPI 配置 Trusted Publisher，三项必须与此处完全一致：
#      Owner:            HanYang06
#      Repository:       onconf
#      Workflow name:    release.yml
#      Environment name: pypi
#    项目名定案后，先在 PyPI 创建对应项目（或提交 pending publisher），
#    再打 v* tag 触发本工作流。
#
#    权限说明：id-token: write 是 OIDC 换取短期凭据的前提；
#    attestations: write 用于写来源证明。二者都不需要长期 secret。
# ============================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "只构建与生成来源证明，跳过真正的 PyPI 发布"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 构建 sdist/wheel，并为其生成可验证的构建来源证明
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # attest-build-provenance 需要 OIDC 令牌完成签名
      attestations: write # 写入 attestation 记录
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 此处刻意**不开缓存**（enable-cache: false）：
      # 本工作流的产物会发布到 PyPI，若复用可写的 Actions cache，
      # 理论上存在 cache poisoning 风险（污染缓存中的依赖 → 污染最终发布件），
      # zizmor 的 cache-poisoning 审计（high）正是针对这一点。
      # 发布工作流一年只跑几次，放弃缓存换确定性是划算的。
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # 构建后端是 uv_build，sdist + wheel 一起产出到 dist/。
      - name: Build
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 构建产物缺失属于严重异常，必须直接失败而不是放过。
          if-no-files-found: error
          retention-days: 30

      # 对 dist/* 生成 SLSA 构建来源证明：使用者可用
      # `gh attestation verify <file> --repo HanYang06/onconf` 校验产物
      # 确实由本仓库的这次运行构建，而非事后被替换。
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # --------------------------------------------------------------------------
  # 发布到 PyPI（dry-run 时整体跳过）
  # --------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build]
    # dry-run 语义：workflow_dispatch 勾选 dry-run（默认 true）时只构建不发版；
    # 打 tag 推送时不带该输入（inputs 上下文为空），因此会真正发布。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: pypi —— 与 PyPI Trusted Publisher 里登记的 Environment name 对应，
    # 同时让这次发布受环境保护规则（审批/限制分支）约束。
    environment: pypi
    permissions:
      id-token: write # 向 PyPI 交换 OIDC 短期发布凭据，无需 API token
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # packages-dir 用 kebab-case（下划线形式在该版本已标记废弃）。
          packages-dir: dist/
