# ============================================================================
# CI —— 提交/PR 的主质量门禁
#
# 约定：
#   1) 所有 action 都固定到 40 位 commit SHA（行尾注释写对应版本）。
#      可变 tag（@v4 之类）可被上游改写，等于把执行权交给上游仓库；
#      固定 SHA 后，升级只能由本仓库显式改这一行来完成。
#   2) 权限最小化：顶层只给 contents: read。CI 只读仓库，不需要任何写权限，
#      因此也不需要（也不应）默认继承仓库设置里的读写 token。
#   3) 每个 job 都有 timeout-minutes：防止 Windows/macOS runner 上偶发卡死
#      把并发额度占满（GitHub 默认单 job 上限 6 小时）。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 上重复推送时取消旧运行，避免排队浪费额度。
# 用 workflow 名 + ref 组键，保证不同工作流之间互不干扰。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 静态检查：ruff / 拼写 / Markdown / 工作流语法
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials: false —— 不把 GITHUB_TOKEN 写进本地 git 配置，
      # 后续步骤（含第三方 action）即使被投毒也拿不到可推送的凭据。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-uv 必须排在 setup-python 之前：它负责安装 uv 并把 uv 加进 PATH。
      # version 与环境中的 uv 0.12.22 对齐，避免 CI 与本地行为漂移。
      # enable-cache 依据 uv.lock / pyproject.toml 缓存下载与构建产物。
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      # 3.14 与 requires-python >=3.14 一致；setup-python 放在 setup-uv 之后，
      # 由它把解释器装好并加入 PATH，随后 uv sync 直接复用这个解释器。
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # --frozen：以 uv.lock 为准，锁定失败就直接失败，禁止 CI 静默改锁文件。
      # --all-groups：dev + docs 全装（mkdocs 的文档站构建也走同一套环境）。
      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # 阻塞项：ruff lint 当前是干净的，任何新违规都应挡住合并。
      - name: Ruff check
        run: uv run ruff check .

      # 非阻塞项（continue-on-error）：仓库现有 7 个文件未按 ruff format 排版，
      # 团队决定暂不重排。此步仅作为提示性信号保留，等排版统一后再改为阻塞。
      - name: Ruff format check (non-blocking, team deferred reformatting)
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Codespell
        run: uv run codespell

      # 第三方许可清单必须与「运行时依赖闭包」一致。脚本自带 --check：
      # 清单与重新生成的结果不一致、或清单文件缺失，都会以非 0 退出。
      # 没有这一步，THIRD_PARTY_NOTICES.md 会悄悄过期而无人发现。
      - name: Third-party notices check
        run: uv run python scripts/gen_third_party_notices.py --check

      # 配置由仓库根目录的 .markdownlint-cli2.yaml 提供：markdownlint-cli2 会按
      # 约定文件名自动发现它（因此不必传 action 的 config 输入 —— 该文件自带
      # 顶层 config: / globs:，再经 --config 传一遍反而语义重叠）。
      # 加 continue-on-error 是因为文档排版问题不应连带弄红整个 CI。
      # globs 仍显式写明：让"扫了哪些文件"在 CI 里一目了然。
      - name: Markdownlint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@07035fd053f7be764496c0f8d8f9f41f98305101 # v22
        with:
          globs: "**/*.md"

      # actionlint 校验 .github/workflows 自身的语法/表达式错误。
      # 注意用 github-token（`token` 输入已标记废弃），用于拉取 actionlint 发布包。
      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          github-token: ${{ github.token }}

  # --------------------------------------------------------------------------
  # 类型检查：mypy strict（pyproject 里已配 strict = true）
  # --------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: Mypy
        run: uv run mypy

  # --------------------------------------------------------------------------
  # 测试：三平台 × Python 3.14，上报覆盖率
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # fail-fast: false —— 一个平台失败后仍要看其余平台的结论，
      # 否则跨平台差异会被"第一个失败"掩盖掉。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # 同时输出终端表与 coverage.xml；coverage.xml 落在仓库根目录，
      # 供下一步跨平台统一上传（不依赖 shell 展开路径）。
      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # artifact 名带上 os，三平台各自留一份互不覆盖。
          name: coverage-${{ matrix.os }}
          # 正斜杠路径在 Linux/macOS/Windows 三种 runner 上都被 upload-artifact 接受。
          path: coverage.xml
          # 覆盖率文件本该必然存在；缺失说明测试步骤异常，应当显式报错而不是静默 warn。
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 安全：bandit / 依赖漏洞 / 工作流审计 / 密钥扫描
  # --------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # gitleaks 需要扫全量提交历史，fetch-depth: 0 关掉浅克隆。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      # 对照 PyPI/GHSA 检查已解析依赖的已知漏洞；CI 环境有网，故不走离线模式。
      - name: pip-audit
        run: uv run pip-audit

      # 审计自身工作流（未固定 SHA、危险触发器、权限过大等）。
      # 刻意不加 --strict：zizmor 1.30.1 里根本没有该选项（已更名为
      # --strict-collection），写上会直接以 "unexpected argument" 退出 2。
      # 同时本仓库无 remote、离线运行，在线审计本就不可用，
      # 用默认严格度才能得到稳定、可解释的结论。
      # 附带说明：--strict-collection 也已验证通过，后续可升级为它。
      - name: zizmor
        run: uv run zizmor .github/workflows

      # 密钥扫描走官方 gitleaks action（无需 --redact 参数）。
      # GITLEAKS_LICENSE 只在**组织**拥有的仓库上必需（gitleaks-action v2 起商业化）；
      # 个人仓库免费，因此这里不传该 secret，组织仓库请自行加上 env.GITLEAKS_LICENSE。
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
