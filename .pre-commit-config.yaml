# ============================================================================
# pre-commit —— 提交前把关
#
# **本地只留「秒级 + 能自动修」的钩子。** 完整检查在 CI 里跑一遍就够了
# （ruff check / ruff format --check / codespell / markdownlint / notices /
# actionlint / mypy / pytest + 覆盖率 / bandit / pip-audit / zizmor / gitleaks，
# 见 .github/workflows/ci.yml）——本地再跑一遍只会让提交变慢、把贡献者劝退。
#
# 留下的两类：
#   1. 提交信息的格式：一条消息就是 PR 标题的来源，值得当场校验；
#   2. 秒级且**能自己修好**的：ruff lint、行尾 / 空白、冲突标记。
#
# 刻意不在这里的（CI 已经覆盖）：
#   - mypy / pytest / bandit / pip-audit / zizmor / codespell / markdownlint
#     —— 慢，或者要联网；
#   - 大文件 / 私钥 / YAML / TOML / JSON 语法 —— 不是高频事故；
#   - `ruff format` 只在 manual 阶段：团队约定暂不重排既有排版。
#
# 工具一律走 `uv run`（repo: local + language: system）：版本只有一个来源 uv.lock。
# ============================================================================

minimum_pre_commit_version: "4.0.0"
fail_fast: false
default_stages: [pre-commit]

repos:
  # --------------------------------------------------------------------------
  # 提交信息规范：Conventional Commits，允许中文 subject
  # --------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit（约定式提交）
        stages: [commit-msg]
        args:
          - --strict
          - --verbose
          - feat
          - fix
          - docs
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - deps
          - style

  # --------------------------------------------------------------------------
  # 文件卫生：毫秒级，且失败时自己就把文件改好了
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict
        name: check-merge-conflict（合并冲突残留）
      - id: end-of-file-fixer
        name: end-of-file-fixer（文件末尾单换行）
      - id: mixed-line-ending
        name: mixed-line-ending（统一 LF —— 与 .gitattributes 一致）
        args: [--fix=lf]
      - id: trailing-whitespace
        name: trailing-whitespace（行尾空白；Markdown 行尾双空格保留）
        args: [--markdown-linebreak-ext=md]

  # --------------------------------------------------------------------------
  # 项目自有检查：一律 `uv run`，版本由 uv.lock 单一事实来源决定
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check（lint + 自动修复）
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format（手动阶段：团队约定暂不重排既有排版）
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [manual]
